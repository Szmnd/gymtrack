[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gymtrack"
version = "0.2.0"
description = "Gym progress tracker with charts, muscle-group breakdown and strength ratings"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Szymon Denkowski"}]
dependencies = [
    "typer>=0.12",
    "pandas>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "httpx>=0.27"]

[project.scripts]
gymtrack = "gymtrack.cli:app"

[tool.setuptools.packages.find]
include = ["gymtrack*"]

[tool.setuptools.package-data]
gymtrack = ["web/*"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008", "B905", "B904"]
